<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>GrammarVerse — Tatabahasa & English Grammar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

  :root {
    --ink: #14213D;
    --ink-600: #243D5C;
    --ink-400: #7F96C0;
    --ink-100: #D5DCEA;
    --ink-50: #EEF1F7;
    --paper: #FAF8F4;
    --card-bg: #FFFFFF;
    --header-bg: #FFFFFF;
    --melayu: #C1440E;
    --melayu-dark: #8F3208;
    --melayu-50: #FDF1EC;
    --english: #2A6F97;
    --english-dark: #1B4E6E;
    --english-50: #EBF3F8;
    --success: #3A8C63;
    --success-50: #EBF6F0;
    --warning: #D4A017;
    --warning-50: #FBF5E6;
    --danger: #C1440E;
    --danger-50: #FDF1EC;
    --radius: 1.25rem;
    --shadow: 0 1px 2px rgba(20,33,61,0.04), 0 8px 24px -8px rgba(20,33,61,0.12);
    --shadow-hover: 0 4px 8px rgba(20,33,61,0.06), 0 16px 40px -12px rgba(20,33,61,0.20);
    --accent: var(--melayu);
    --accent-dark: var(--melayu-dark);
    --accent-50: var(--melayu-50);
  }

  body.dark-mode {
    --ink: #F4F1EA;
    --ink-600: #D5DCEA;
    --ink-400: #8FA3C7;
    --ink-100: #33456B;
    --ink-50: #1C2A45;
    --paper: #0E182C;
    --card-bg: #14213D;
    --header-bg: #14213D;
    --melayu-50: rgba(193,68,14,0.15);
    --english-50: rgba(42,111,151,0.18);
    --success-50: rgba(58,140,99,0.15);
    --warning-50: rgba(212,160,23,0.15);
    --danger-50: rgba(193,68,14,0.15);
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px -8px rgba(0,0,0,0.4);
    --shadow-hover: 0 4px 8px rgba(0,0,0,0.25), 0 16px 40px -12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    padding-bottom: 72px;
    transition: background-color .25s ease, color .25s ease;
  }
  h1, h2, h3, h4 { font-family: 'Fraunces', Georgia, serif; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  :focus-visible {
    outline: 2px solid var(--melayu);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ===== Layout ===== */
  .container { max-width: 880px; margin: 0 auto; padding: 0 20px; }
  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--ink-50);
    background: var(--header-bg); position: sticky; top: 0; z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.15rem; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--melayu), var(--english)); }
  .header-actions { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center; color: var(--ink);
    transition: background .15s;
  }
  .icon-btn:hover { background: var(--ink-50); }
  .icon-btn svg { width: 20px; height: 20px; }

  /* Default icon sizing: any bare SVG inside interactive elements stays compact
     unless a parent explicitly sets its own width/height (inline style wins). */
  .btn svg, .pill svg, .nav-item svg, button svg:not([style*="width"]) {
    width: 16px; height: 16px; flex-shrink: 0;
  }
  .nav-item svg { width: 20px; height: 20px; }

  /* ===== Bottom nav ===== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: var(--card-bg); border-top: 1px solid var(--ink-50);
    display: flex; padding: 6px 0 max(6px, env(safe-area-inset-bottom));
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: none; padding: 6px 2px; color: var(--ink-400); font-size: 10.5px; font-weight: 600;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { width: 20px; height: 20px; }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 999px; font-weight: 600; border: none; transition: all .15s ease-out;
    padding: 12px 22px; font-size: 0.9rem;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--ink); color: var(--paper); box-shadow: var(--shadow); }
  .btn-primary:hover:not(:disabled) { background: var(--ink-600); box-shadow: var(--shadow-hover); }
  .btn-accent { background: var(--accent); color: white; box-shadow: var(--shadow); }
  .btn-accent:hover:not(:disabled) { background: var(--accent-dark); box-shadow: var(--shadow-hover); }
  .btn-outline { background: transparent; border: 2px solid var(--ink); color: var(--ink); padding: 10px 20px; }
  .btn-outline:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .btn-ghost { background: transparent; color: var(--ink); padding: 10px 16px; }
  .btn-ghost:hover:not(:disabled) { background: var(--ink-50); }
  .btn-sm { padding: 8px 14px; font-size: 0.8rem; }

  /* ===== Cards ===== */
  .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--ink-50); }
  .card-hover { transition: box-shadow .2s, transform .2s; }
  .card-hover:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .card-pad { padding: 20px; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; border-radius: 999px;
    padding: 4px 12px; font-size: 0.7rem; font-weight: 700; font-family: 'JetBrains Mono', monospace;
  }
  .pill-neutral { background: var(--ink-50); color: var(--ink-600); }
  .pill-accent { background: var(--accent-50); color: var(--accent-dark); }
  .pill-success { background: var(--success-50); color: var(--success); }
  .pill-warning { background: var(--warning-50); color: var(--warning); }
  .pill-danger { background: var(--danger-50); color: var(--danger); }

  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-400); margin-bottom: 8px; display: block; }

  /* ===== Home / language cards ===== */
  .lang-grid { display: grid; gap: 16px; margin: 28px 0; }
  @media (min-width: 640px) { .lang-grid { grid-template-columns: 1fr 1fr; gap: 0; } }
  .lang-card {
    text-align: left; border: none; color: white; padding: 32px 28px; min-height: 240px;
    display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;
    transition: transform .3s;
  }
  .lang-card:hover { transform: translateY(-4px); }
  .lang-card.ms { background: var(--melayu); border-radius: var(--radius) var(--radius) 0 0; }
  .lang-card.en { background: var(--english); border-radius: 0 0 var(--radius) var(--radius); }
  @media (min-width: 640px) {
    .lang-card.ms { border-radius: var(--radius) 0 0 var(--radius); }
    .lang-card.en { border-radius: 0 var(--radius) var(--radius) 0; }
  }
  .lang-emoji { font-size: 2.5rem; display: block; margin-bottom: 14px; }
  .lang-title { font-size: 1.4rem; font-weight: 600; margin-bottom: 8px; }
  .lang-desc { font-size: 0.85rem; opacity: 0.85; max-width: 280px; line-height: 1.5; }
  .lang-cta { font-size: 0.85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; white-space: nowrap; }
  .lang-cta svg { width: 16px; height: 16px; flex-shrink: 0; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat-box { text-align: center; padding: 14px 8px; }
  .stat-num { font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 600; }
  .stat-label { font-size: 0.7rem; color: var(--ink-400); margin-top: 2px; }

  /* ===== Progress ring ===== */
  .ring-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
  .ring-label { position: absolute; text-align: center; }
  .ring-num { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.1rem; }

  /* ===== Topic list ===== */
  .topic-row {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
    border-bottom: 1px solid var(--ink-50); cursor: pointer; transition: background .15s;
  }
  .topic-row:last-child { border-bottom: none; }
  .topic-row:hover { background: #fafafa; }
  .topic-row.locked { opacity: 0.55; cursor: not-allowed; }
  .topic-row-left { display: flex; align-items: center; gap: 12px; }

  /* ===== Topic detail ===== */
  .section-nav {
    display: flex; gap: 4px; overflow-x: auto; padding: 10px 0; margin-bottom: 4px;
    border-bottom: 1px solid var(--ink-50); position: sticky; top: 61px; background: var(--paper); z-index: 20;
  }
  .section-nav a {
    white-space: nowrap; padding: 6px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 700;
    color: var(--ink-600); text-decoration: none; flex-shrink: 0;
  }
  .section-nav a:hover { background: var(--ink-50); }
  .topic-section { padding: 28px 0; border-bottom: 1px solid var(--ink-50); scroll-margin-top: 110px; }
  .topic-section:last-child { border-bottom: none; }

  .note-box { border-radius: 14px; padding: 16px; margin-bottom: 12px; background: var(--ink-50); }
  .note-box h4 { font-size: 0.9rem; margin-bottom: 6px; font-family: 'Inter', sans-serif; font-weight: 700; }
  .note-box p { font-size: 0.85rem; line-height: 1.6; color: var(--ink-600); white-space: pre-line; }

  .example-grid { display: grid; gap: 10px; }
  @media (min-width: 640px) { .example-grid { grid-template-columns: 1fr 1fr; } }
  .example-card { padding: 14px; cursor: pointer; }
  .example-card p.txt { font-size: 0.88rem; font-weight: 500; margin-bottom: 8px; }
  .example-card .exp { font-size: 0.78rem; color: var(--ink-400); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--ink-50); display: none; }
  .example-card.open .exp { display: block; }

  .mistake-card { padding: 14px; margin-bottom: 10px; }
  .mistake-line { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; font-size: 0.85rem; }
  .mistake-wrong { text-decoration: line-through; color: var(--ink-400); }
  .mistake-correct { font-weight: 600; }
  .mistake-reason { font-size: 0.78rem; color: var(--ink-400); padding-left: 24px; }

  /* ===== Exercise runner ===== */
  .exercise-box { max-width: 560px; margin: 0 auto; }
  .exercise-progress { display: flex; gap: 4px; margin-bottom: 18px; }
  .exercise-dot { height: 5px; flex: 1; border-radius: 999px; background: var(--ink-50); }
  .exercise-dot.done { background: var(--success); }
  .exercise-dot.active { background: var(--accent); }
  .exercise-q { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 500; margin-bottom: 18px; }
  .opt-btn {
    display: block; width: 100%; text-align: left; padding: 13px 16px; border-radius: 14px;
    border: 2px solid var(--ink-50); background: var(--card-bg); color: var(--ink); font-size: 0.88rem; font-weight: 500;
    margin-bottom: 8px; transition: border-color .15s;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--ink-100); }
  .opt-btn.selected { border-color: var(--ink); }
  .opt-btn.correct { border-color: var(--success); background: var(--success-50); color: var(--success); }
  .opt-btn.wrong { border-color: var(--danger); background: var(--danger-50); color: var(--danger); }
  .feedback-box { border-radius: 14px; padding: 14px; margin: 14px 0; font-size: 0.85rem; }
  .feedback-box.correct { background: var(--success-50); color: var(--success); }
  .feedback-box.incorrect { background: var(--danger-50); color: var(--danger); }
  .feedback-box .exp-text { color: var(--ink-600); margin-top: 4px; }

  /* ===== Flashcard ===== */
  .flashcard-wrap { max-width: 380px; margin: 0 auto; }
  .flashcard { aspect-ratio: 4/3; perspective: 1000px; margin-bottom: 20px; cursor: pointer; }
  .flashcard-inner { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
  .flashcard-face {
    position: absolute; inset: 0; border-radius: var(--radius); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px; backface-visibility: hidden;
    box-shadow: var(--shadow);
  }
  .flashcard-front { background: var(--accent); color: white; }
  .flashcard-back { background: var(--card-bg); transform: rotateY(180deg); }

  /* ===== Memory game ===== */
  .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .memory-card {
    aspect-ratio: 1; border-radius: 12px; border: none; display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 600; text-align: center; padding: 6px; background: var(--ink-50); transition: all .2s;
  }
  .memory-card.flipped { background: var(--accent); color: white; }
  .memory-card.matched { background: var(--success-50); color: var(--success); }

  /* ===== Misc ===== */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-400); }
  .divider { height: 1px; background: var(--ink-50); margin: 16px 0; }
  table.mini { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.mini th, table.mini td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--ink-50); }
  table.mini th { background: var(--ink-50); font-weight: 700; }

  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 12px 20px; border-radius: 999px;
    font-size: 0.85rem; font-weight: 600; box-shadow: var(--shadow-hover); z-index: 100;
    animation: toast-in .3s ease-out;
  }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  .fade-in { animation: fade-in .3s ease-out; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast-root"></div>

<script>
// ============================================================
// GRAMMARVERSE - DATA TOPIK
// ============================================================
const TOPICS = {
  'ms-huruf-bunyi': {
    id: 'ms-huruf-bunyi', lang: 'ms', level: 'Beginner', module: 'Pengenalan',
    title: 'Huruf dan Bunyi',
    desc: 'Kenali huruf vokal, konsonan dan bunyi asas Bahasa Melayu.',
    objective: 'Anda boleh mengenal pasti huruf vokal dan konsonan, serta memahami bagaimana bunyi digabungkan membentuk perkataan.',
    intro: 'Bahasa Melayu menggunakan abjad Rumi dengan 26 huruf: 5 vokal (a, e, i, o, u) dan 21 konsonan. Gabungan huruf ini membentuk bunyi yang seterusnya membentuk perkataan.',
    notes: [
      { h: 'Huruf Vokal', b: '5 huruf: a, e, i, o, u. Vokal "e" ada dua bunyi: e taling (bebas) dan e pepet (secara, empat).' },
      { h: 'Huruf Konsonan', b: '21 huruf selain vokal: b, c, d, f, g, h, j, k, l, m, n, p, q, r, s, t, v, w, x, y, z.' },

    ],
    mnemonics: [{ t: 'AEIOU', tip: 'Ingat vokal ikut urutan A-E-I-O-U seperti dalam abjad — memudahkan mengenal pasti huruf vokal dalam sebarang perkataan.' }],
    examples: [
      { t: 'Kucing itu comel.', c: 'Vokal', e: 'Perkataan "kucing" mengandungi vokal u dan i.' },
      { t: 'Pandai dan pulau.', c: 'Diftong', e: '"Pandai" ada diftong "ai", "pulau" ada diftong "au".' },
      { t: 'Emak memasak nasi lemak.', c: 'Konsonan', e: 'Banyak konsonan m, k, s digunakan berulang.' },
      { t: 'Abang saya suka bola sepak.', c: 'Vokal', e: 'Perkataan "abang" bermula dan berakhir dengan vokal a.' },
      { t: 'Amboi, cantiknya baju itu!', c: 'Diftong', e: '"Amboi" mengandungi diftong "oi".' },
    ],
    mistakes: [
      { w: 'pandey (sebutan salah untuk "pandai")', c: 'pandai', r: 'Diftong "ai" disebut sebagai satu bunyi meluncur, bukan dieja terpisah.' },
      { w: 'Emak dieja "emek".', c: 'emak', r: 'Bunyi "a" tidak bertukar kepada "e" walaupun sebutan harian kadangkala berbeza.' },
    ],
    exercises: [
      { type: 'mcq', q: 'Yang manakah huruf vokal?', opts: ['b', 'e', 'k', 't'], a: 'e', e: '"e" ialah salah satu daripada 5 huruf vokal.' },
      { type: 'tf', q: 'Bahasa Melayu mempunyai 6 huruf vokal.', a: 'Salah', e: 'Hanya 5 huruf vokal: a, e, i, o, u.' },
      { type: 'mcq', q: 'Diftong dalam perkataan "pulau" ialah?', opts: ['ua', 'au', 'pu', 'la'], a: 'au', e: '"Au" ialah gabungan dua vokal membentuk satu bunyi.' },
    ],
    summary: 'Bahasa Melayu ada 5 vokal dan 21 konsonan. Diftong (ai/au/oi) ialah gabungan dua vokal jadi satu bunyi.',
  },

  'ms-perkataan-suku-kata': {
    id: 'ms-perkataan-suku-kata', lang: 'ms', level: 'Beginner', module: 'Pengenalan',
    title: 'Perkataan dan Suku Kata',
    desc: 'Memahami struktur suku kata dan jenis-jenis perkataan.',
    objective: 'Anda boleh memecahkan perkataan kepada suku kata dan mengenal pasti jenis perkataan mengikut bilangan suku kata.',
    intro: 'Suku kata ialah unit bunyi yang diucapkan dalam satu hembusan nafas. Perkataan Bahasa Melayu dibentuk daripada satu atau lebih suku kata, contohnya "ma-kan" (2 suku kata).',
    notes: [
      { h: 'Pola Suku Kata', b: 'Pola paling biasa: KV (konsonan-vokal) seperti "ma", "ka". Juga ada KVK (kan, sim), V (a, i), VK (an, ir).' },
      { h: 'Cara Memecahkan Suku Kata', b: 'Setiap suku kata mesti ada sekurang-kurangnya satu vokal. Contoh: "sekolah" = se-ko-lah (3 suku kata).' },
      { h: 'Perkataan Berdasarkan Suku Kata', b: 'Ekasuku (1 suku kata: cat, bas), Dwisuku (2: baju, meja), Polisuku (3+: sekolah, universiti).' },
    ],
    mnemonics: [{ t: 'Tepuk Suku Kata', tip: 'Sebut perkataan perlahan-lahan sambil tepuk tangan pada setiap bunyi — jumlah tepukan = jumlah suku kata.' }],
    examples: [
      { t: 'Buku itu tebal.', c: 'Dwisuku', e: '"Buku" = bu-ku (2 suku kata).' },
      { t: 'Sekolah saya jauh.', c: 'Polisuku', e: '"Sekolah" = se-ko-lah (3 suku kata).' },
      { t: 'Cat baru itu cantik.', c: 'Ekasuku', e: '"Cat" ialah satu suku kata sahaja.' },
      { t: 'Universiti itu terkenal.', c: 'Polisuku', e: '"Universiti" = u-ni-ver-si-ti (5 suku kata).' },
      { t: 'Ambil bola merah itu.', c: 'Campuran', e: 'Ayat mengandungi pelbagai jenis perkataan mengikut suku kata.' },
    ],
    mistakes: [
      { w: 'Sekolah dipecah "sek-olah".', c: 'se-ko-lah', r: 'Setiap suku kata mesti mengandungi satu vokal sahaja sebagai teras.' },
      { w: 'Buku dipecah "b-uku".', c: 'bu-ku', r: 'Konsonan digabungkan dengan vokal berikutnya, bukan berdiri sendiri.' },

    exercises: [
      { type: 'mcq', q: 'Berapa suku kata dalam "sekolah"?', opts: ['1', '2', '3', '4'], a: '3', e: 'se-ko-lah = 3 suku kata.' },

      { type: 'mcq', q: 'Pecahan suku kata yang betul untuk "meja"?', opts: ['mej-a', 'me-ja', 'm-eja', 'meja'], a: 'me-ja', e: 'Setiap suku kata ada satu vokal sebagai teras.' },
    ],
    summary: 'Suku kata ialah unit bunyi asas. Perkataan digolongkan sebagai ekasuku, dwisuku, atau polisuku mengikut bilangan suku kata.',
  },

  'ms-frasa-ayat': {
    id: 'ms-frasa-ayat', lang: 'ms', level: 'Beginner', module: 'Pengenalan',
    title: 'Frasa dan Ayat',

      { w: 'Tolong betulkan kesilapan ini secepat mungkin dengan -i.', c: 'Tolong betulkan kesilapan ini secepat mungkin.', r: '"Betul" + -kan = "betulkan" sudah tepat; tidak perlu tukar kepada -i yang membawa makna berbeza.' },

    exercises: [

    intro: 'Peribahasa ialah ayat/rangkai kata dengan makna kiasan yang mengandungi pengajaran. Simpulan Bahasa ialah rangkai kata tetap dengan makna khusus yang tidak boleh diubah susunannya.',
    notes: [
      { h: 'Peribahasa', b: 'Ungkapan berbentuk ayat pendek dengan pengajaran/nasihat tersirat. Contoh: "Bagai aur dengan tebing" (saling bergantung dan membantu).' },
      { h: 'Simpulan Bahasa', b: 'Rangkai kata (biasanya 2 perkataan) dengan makna kiasan tetap. Contoh: "kaki bangku" (peserta lemah), "makan angin" (bersiar-siar).' },
      { h: 'Bidalan, Pepatah, Perumpamaan', b: 'Bidalan/pepatah = peribahasa mengandungi nasihat/sindiran halus ("Melentur buluh biarlah dari rebungnya"). Perumpamaan = peribahasa berbentuk perbandingan menggunakan "bagai/seperti/umpama" ("Bagai pinang dibelah dua").' },
    ],
    mnemonics: [{ t: 'Simpulan = Ringkas, Peribahasa = Ayat', tip: 'Simpulan Bahasa biasanya 2 perkataan pendek (kaki ayam). Peribahasa biasanya ayat penuh dengan pengajaran (Bagai aur dengan tebing).' }],
    examples: [
      { t: 'Mereka bagai aur dengan tebing, saling membantu.', c: 'Peribahasa', e: 'Menggambarkan hubungan saling bergantung dan membantu.' },
      { t: 'Budak itu memang kaki bangku dalam pasukan bola sepak.', c: 'Simpulan Bahasa', e: '"Kaki bangku" bermaksud pemain yang lemah/jarang bermain.' },
      { t: 'Melentur buluh biarlah dari rebungnya.', c: 'Bidalan', e: 'Nasihat: didik anak sejak kecil lagi.' },
      { t: 'Wajah adik-beradik itu bagai pinang dibelah dua.', c: 'Perumpamaan', e: 'Perbandingan menunjukkan persamaan rupa yang sangat ketara.' },
      { t: 'Dia suka makan angin setiap hujung minggu.', c: 'Simpulan Bahasa', e: '"Makan angin" bermaksud bersiar-siar/berehat.' },
    ],
    mistakes: [
      { w: 'Menggunakan peribahasa di luar konteks yang sesuai.', c: 'Fahami makna sebenar sebelum menggunakan peribahasa dalam ayat.', r: 'Peribahasa mempunyai makna kiasan tetap; guna secara literal akan mengelirukan pembaca.' },
      { w: 'Mengubah susunan simpulan bahasa: "bangku kaki".', c: 'kaki bangku', r: 'Simpulan bahasa mempunyai susunan tetap yang tidak boleh diubah sewenang-wenangnya.' },
    ],
    exercises: [
      { type: 'mcq', q: 'Maksud "kaki bangku"?', opts: ['Suka duduk', 'Pemain lemah', 'Sangat pantas', 'Suka berjalan'], a: 'Pemain lemah', e: 'Simpulan bahasa ini merujuk peserta/pemain yang kurang mahir.' },
      { type: 'tf', q: '"Bagai pinang dibelah dua" ialah simpulan bahasa.', a: 'Salah', e: 'Ia adalah perumpamaan (menggunakan "bagai" untuk perbandingan).' },
      { type: 'mcq', q: 'Maksud "makan angin"?', opts: ['Berlapar', 'Bersiar-siar', 'Marah', 'Bercakap kosong'], a: 'Bersiar-siar', e: '"Makan angin" ialah simpulan bahasa bermaksud rehat/bersiar-siar.' },
    ],
    summary: 'Peribahasa (ayat + pengajaran), Simpulan Bahasa (2 perkataan + makna tetap), Perumpamaan (guna bagai/seperti untuk perbandingan).',
  },

  'ms-wacana': {
    id: 'ms-wacana', lang: 'ms', level: 'Advanced', module: 'Wacana',
    title: 'Wacana: Penanda Wacana, Kohesi dan Koheren',
    desc: 'Membina teks yang tersusun dan mudah difahami.',
    objective: 'Anda boleh menggunakan penanda wacana untuk menghasilkan penulisan yang kohesif dan koheren.',
    intro: 'Wacana merujuk kepada teks/ujaran yang lebih besar daripada ayat tunggal — seperti perenggan atau karangan penuh. Kohesi dan koheren memastikan wacana mengalir dengan lancar dan mudah difahami.',
    notes: [
      { h: 'Penanda Wacana', b: 'Perkataan/frasa yang menghubungkan idea antara ayat: pertama, seterusnya, walau bagaimanapun, oleh itu, kesimpulannya, selain itu.' },
      { h: 'Kohesi', b: 'Perkaitan pada peringkat bahasa (rujukan, kata ganti, kata hubung) yang menyatukan ayat-ayat secara struktur. Contoh: guna "dia/mereka" untuk merujuk semula kepada subjek yang disebut.' },
      { h: 'Koheren', b: 'Perkaitan pada peringkat makna/idea — teks masuk akal secara logik walaupun tiada penanda eksplisit. Idea mengalir secara tersusun daripada permulaan hingga kesimpulan.' },
    ],
    mnemonics: [{ t: 'Kohesi = Struktur, Koheren = Makna', tip: 'KOHESI ada kaitan dengan perkataan penghubung (struktur luaran). KOHEREN ada kaitan dengan logik idea (struktur dalaman/makna).' }],
    examples: [
      { t: 'Pertama, kita perlu kenal pasti masalah. Seterusnya, cari penyelesaian.', c: 'Penanda Wacana', e: '"Pertama" dan "seterusnya" menyusun idea secara berurutan.' },
      { t: 'Ali seorang pelajar cemerlang. Dia rajin belajar setiap hari.', c: 'Kohesi', e: '"Dia" merujuk semula kepada "Ali" — pertalian rujukan kata ganti.' },
      { t: 'Walau bagaimanapun, keputusan itu masih belum muktamad.', c: 'Penanda Wacana', e: '"Walau bagaimanapun" menunjukkan unsur kontras/pertentangan.' },
      { t: 'Kesimpulannya, pendidikan amat penting untuk masa depan negara.', c: 'Penanda Wacana', e: '"Kesimpulannya" menandakan bahagian penutup wacana.' },
      { t: 'Selain itu, kerajaan turut memperkenalkan dasar baharu.', c: 'Penanda Wacana', e: '"Selain itu" menambah idea baharu berkaitan idea sebelumnya.' },
    ],
    mistakes: [
      { w: 'Menggunakan "walau bagaimanapun" untuk menambah idea sama arah.', c: 'Gunakan "selain itu" atau "tambahan pula" untuk idea searah; "walau bagaimanapun" untuk kontras sahaja.', r: 'Penanda wacana kontras (walau bagaimanapun, namun) tidak sesuai untuk menyambung idea yang selari/sama arah.' },
      { w: 'Perenggan tanpa sebarang penanda wacana antara idea.', c: 'Sisipkan penanda wacana yang sesuai antara ayat/perenggan.', r: 'Ketiadaan penanda wacana menyebabkan teks kelihatan terputus-putus dan sukar diikuti pembaca.' },
    ],
    exercises: [
      { type: 'mcq', q: 'Penanda wacana untuk menunjukkan KONTRAS?', opts: ['selain itu', 'walau bagaimanapun', 'pertama', 'kesimpulannya'], a: 'walau bagaimanapun', e: 'Menunjukkan pertentangan dengan idea sebelumnya.' },
      { type: 'tf', q: 'Kohesi dan koheren membawa maksud yang sama persis.', a: 'Salah', e: 'Kohesi = struktur bahasa; Koheren = logik makna. Keduanya berbeza walaupun berkait rapat.' },
      { type: 'mcq', q: 'Penanda wacana untuk MENAMBAH idea searah?', opts: ['tetapi', 'selain itu', 'namun', 'sebaliknya'], a: 'selain itu', e: '"Selain itu" menambah maklumat yang selari dengan idea sebelumnya.' },
    ],
    summary: 'Penanda Wacana menghubung idea antara ayat (pertama, walau bagaimanapun, kesimpulannya). Kohesi = perkaitan struktur bahasa; Koheren = perkaitan logik makna.',
  },

  'en-alphabet-phonics': {
    id: 'en-alphabet-phonics', lang: 'en', level: 'Beginner', module: 'English Basics',
    title: 'Alphabet and Phonics',
    desc: 'Vowels, consonants, and basic sound patterns.',
    objective: 'You can identify vowels and consonants, and recognise common phonics patterns in English words.',
    intro: 'English uses 26 letters: 5 vowels (a, e, i, o, u) and 21 consonants. Phonics is how letters combine to create sounds, forming the building blocks of words.',
    notes: [
      { h: 'Vowels', b: '5 letters: a, e, i, o, u. Sometimes "y" acts as a vowel too (e.g. "my", "sky").' },
      { h: 'Consonants', b: '21 letters besides vowels. Consonant blends combine two consonants with one sound: "bl" (black), "st" (stop), "ch" (chair).' },
      { h: 'Common Phonics Patterns', b: 'Silent "e" makes the previous vowel long: "cap" vs "cape". Digraphs like "sh", "th", "ph" make one new sound.' },
    ],
    mnemonics: [{ t: 'Silent E Rule', tip: 'A silent "e" at the end of a word usually makes the vowel before it say its own name: "kit" → "kite".' }],
    examples: [
      { t: 'The cat sat on the mat.', c: 'Simple', e: 'Short vowel sounds throughout — "a" sounds the same in cat, sat, mat.' },
      { t: 'She likes to bake a cake.', c: 'Silent E', e: '"Bake" and "cake" use silent "e" to make the "a" say its name.' },
      { t: 'The ship sailed through the storm.', c: 'Digraph', e: '"Sh" and "th" are digraphs making single new sounds.' },
      { t: 'Black clouds covered the sky.', c: 'Blend', e: '"Bl" is a consonant blend at the start of "black".' },
      { t: 'My brother plays the drums.', c: 'Y as vowel', e: '"My" uses "y" as a vowel sound.' },
    ],
    mistakes: [
      { w: 'Pronouncing "cap" and "cape" the same way.', c: 'Silent "e" changes the vowel sound: cap (short a) vs cape (long a).', r: 'The silent "e" rule is often overlooked by learners transferring pronunciation habits from other languages.' },
      { w: 'Treating "th" as two separate sounds.', c: '"Th" is a single digraph sound, not "t" + "h" separately.', r: 'Digraphs combine to form one new sound, different from either letter alone.' },
    ],
    exercises: [
      { type: 'mcq', q: 'Which word has a silent "e"?', opts: ['cat', 'cake', 'dog', 'run'], a: 'cake', e: '"Cake" ends in silent "e" which changes the vowel sound.' },
      { type: 'tf', q: '"Sh" in "ship" is pronounced as two separate sounds.', a: 'False', e: '"Sh" is a digraph — one combined sound, not two.' },
      { type: 'mcq', q: 'Which is a consonant blend?', opts: ['ee', 'bl', 'ai', 'oo'], a: 'bl', e: '"Bl" combines two consonants with both sounds still heard.' },
    ],
    summary: '5 vowels (a,e,i,o,u), 21 consonants. Silent "e" changes vowel sounds; digraphs (sh,th) make one new sound; blends (bl,st) combine sounds.',
  },

  'en-words-sentences': {
    id: 'en-words-sentences', lang: 'en', level: 'Beginner', module: 'English Basics',
    title: 'Words and Sentences',
    desc: 'Building blocks of English communication.',
    objective: 'You can identify what makes a complete sentence versus an incomplete phrase.',
    intro: 'A word is the smallest unit of meaning. A sentence is a group of words that expresses a complete thought, containing at minimum a subject and a verb.',
    notes: [
      { h: 'Words', b: 'The smallest meaningful units of language. Can be nouns, verbs, adjectives, etc.' },
      { h: 'Sentences', b: 'Must contain a subject (who/what) and a predicate (what happens). Must express a COMPLETE thought.' },
      { h: 'Sentence vs Fragment', b: 'A fragment is an incomplete thought: "Running fast" (no subject). A sentence is complete: "She is running fast."' },
    ],
    mnemonics: [{ t: 'The "Stand Alone" Test', tip: 'If a group of words makes sense standing completely alone, it\'s a sentence. If it leaves you asking "what about it?", it\'s a fragment.' }],
    examples: [
      { t: 'Books.', c: 'Fragment', e: 'Just a single word — no subject-verb relationship, not a complete sentence.' },
      { t: 'The books are on the shelf.', c: 'Sentence', e: 'Subject "the books" + predicate "are on the shelf" = complete thought.' },
      { t: 'Running in the park.', c: 'Fragment', e: 'No clear subject doing the action — incomplete.' },
      { t: 'She was running in the park.', c: 'Sentence', e: 'Subject "she" + predicate "was running in the park" = complete.' },
      { t: 'Because it was raining.', c: 'Fragment', e: 'Starts with "because" but has no main clause to complete the thought.' },
    ],
    mistakes: [
      { w: 'Writing "Because it was raining." as a complete sentence.', c: 'Because it was raining, we stayed home.', r: 'A subordinate clause alone (starting with "because") is a fragment; it needs a main clause.' },
      { w: 'No capital letter at the start: "she went home."', c: 'She went home.', r: 'Every sentence must begin with a capital letter.' },
    ],
    exercises: [
      { type: 'mcq', q: 'Which is a complete sentence?', opts: ['Running fast', 'The dog barked loudly.', 'In the morning', 'Because of the rain'], a: 'The dog barked loudly.', e: 'Has a clear subject "the dog" and predicate "barked loudly".' },
      { type: 'tf', q: '"Books." is a complete sentence.', a: 'False', e: 'It is a single word with no subject-predicate relationship.' },
      { type: 'mcq', q: 'What makes a sentence complete?', opts: ['Only a verb', 'A capital letter only', 'Subject and predicate', 'A long length'], a: 'Subject and predicate', e: 'Both elements are required to express a complete thought.' },
    ],
    summary: 'Words are meaning units; sentences need a subject + predicate expressing a complete thought. Fragments are incomplete thoughts standing alone.',
  },

    title: 'Capital Letters and Punctuation',

    notes: [
      { h: 'When to Capitalise', b: 'Start of every sentence, proper nouns (names, places), the pronoun "I", days/months, titles.' },
      { h: 'End Punctuation', b: 'Period (.) for statements, question mark (?) for questions, exclamation mark (!) for strong emotion.' },
      { h: 'Commas', b: 'Separate items in a list (apples, oranges, and bananas), after introductory phrases (After lunch, we left), before conjunctions in compound sentences.' },
    ],
    mnemonics: [{ t: 'CAPS for Capitalisation', tip: 'Capitalise: Countries/Cities, All sentence starts, Proper names, Special pronoun "I".' }],
    examples: [
      { t: 'My friend Ahmad lives in Kuala Lumpur.', c: 'Capitals', e: '"Ahmad" and "Kuala Lumpur" are proper nouns requiring capitals.' },
      { t: 'What time does the shop open?', c: 'Question', e: 'Ends with a question mark since it asks something.' },
      { t: 'Watch out, the floor is wet!', c: 'Exclamation', e: 'Exclamation mark shows urgency/strong feeling.' },
      { t: 'We bought apples, oranges, and bananas.', c: 'Comma', e: 'Commas separate items in a list.' },
      { t: 'After the meeting, we went for lunch.', c: 'Comma', e: 'Comma follows an introductory phrase.' },

      { type: 'tf', q: 'The pronoun "i" does not need to be capitalised.', a: 'False', e: 'The pronoun "I" is ALWAYS capitalised in English.' },
      { type: 'mcq', q: 'Which needs a comma?', opts: ['She is happy.', 'After school we played football.', 'He runs fast.', 'I like tea.'], a: 'After school we played football.', e: 'Needs a comma after the introductory phrase: "After school, we played football."' },

  'en-pronouns': {
    id: 'en-pronouns', lang: 'en', level: 'Beginner', module: 'Pronouns',
    title: 'Pronouns: Subject, Object, Possessive & Reflexive',
    desc: 'Replace nouns correctly using the right pronoun type.',
    objective: 'You can use subject, object, possessive, and reflexive pronouns correctly in sentences.',
    intro: 'Pronouns replace nouns to avoid repetition. Example: "Sarah is a teacher. She teaches English." — "she" replaces "Sarah".',
    notes: [
      { h: 'Subject Pronouns', b: 'Used as the subject (doer): I, you, he, she, it, we, they. Example: "She reads books."' },
      { h: 'Object Pronouns', b: 'Used as the object (receiver): me, you, him, her, it, us, them. Example: "Give the book to her."' },
      { h: 'Possessive & Reflexive', b: 'Possessive shows ownership: my/mine, his, her/hers, their/theirs. Reflexive refers back to the subject: myself, himself, themselves.' },
    ],
    mnemonics: [{ t: 'Subject Does, Object Receives', tip: 'Subject pronouns DO the action (She runs). Object pronouns RECEIVE the action (Call her).' }],
    examples: [
      { t: 'She is my best friend.', c: 'Subject', e: '"She" is the subject performing the state of being.' },
      { t: 'I gave the book to him.', c: 'Object', e: '"Him" receives the action of giving.' },
      { t: 'This is her bag, not mine.', c: 'Possessive', e: '"Her" and "mine" show ownership.' },
      { t: 'He hurt himself while playing football.', c: 'Reflexive', e: '"Himself" refers back to the subject "he".' },
      { t: 'They invited us to their party.', c: 'Mixed', e: '"They" (subject), "us" (object), "their" (possessive) all used together.' },
    ],
    mistakes: [
      { w: 'Me and him went to the shop.', c: 'He and I went to the shop.', r: 'Subject pronouns (I, he) are needed as the subject, not object pronouns (me, him).' },
      { w: 'This book is her\'s.', c: 'This book is hers.', r: 'Possessive pronoun "hers" never takes an apostrophe.' },
    ],
    exercises: [
      { type: 'mcq', q: 'Choose the correct pronoun: "___ is going to the market."', opts: ['Her', 'She', 'Hers', 'Herself'], a: 'She', e: 'Subject pronoun needed as the doer of the action.' },
      { type: 'tf', q: '"Him" can be used as a subject pronoun.', a: 'False', e: '"Him" is an object pronoun; "he" is the subject form.' },
      { type: 'mcq', q: 'Reflexive pronoun in: "I taught myself to swim."?', opts: ['I', 'taught', 'myself', 'swim'], a: 'myself', e: '"Myself" refers back to the subject "I".' },
    ],
    summary: 'Subject pronouns (I, she) do the action. Object pronouns (me, her) receive it. Possessive (mine, hers) shows ownership. Reflexive (myself) refers back to subject.',
  },

  'en-adverbs': {
    id: 'en-adverbs', lang: 'en', level: 'Intermediate', module: 'Adverbs',
    title: 'Adverbs: Manner, Time, Place & Frequency',
    desc: 'Describe verbs, adjectives, or other adverbs.',
    objective: 'You can identify and correctly place adverbs of manner, time, place, and frequency in sentences.',
    intro: 'An adverb modifies a verb, adjective, or another adverb — often answering "how", "when", "where", or "how often".',
    notes: [
      { h: 'Adverbs of Manner', b: 'Describe HOW something happens. Often end in "-ly": quickly, carefully, quietly. Example: "She spoke softly."' },
      { h: 'Adverbs of Time & Place', b: 'Time answers WHEN: yesterday, soon, now. Place answers WHERE: here, there, outside, upstairs.' },
      { h: 'Adverbs of Frequency', b: 'Answer HOW OFTEN: always, usually, often, sometimes, rarely, never. Usually placed before the main verb.' },
    ],
    mnemonics: [{ t: 'The -LY Test', tip: 'Many manner adverbs are adjective + "-ly": quick→quickly, careful→carefully. But watch out: "fast" and "hard" stay the same as adverbs!' }],
    examples: [
      { t: 'She sings beautifully.', c: 'Manner', e: '"Beautifully" describes HOW she sings.' },
      { t: 'We will leave tomorrow.', c: 'Time', e: '"Tomorrow" tells WHEN they will leave.' },
      { t: 'Please wait here.', c: 'Place', e: '"Here" tells WHERE to wait.' },
      { t: 'He always arrives early.', c: 'Frequency', e: '"Always" tells HOW OFTEN he arrives early.' },
      { t: 'She rarely eats fast food.', c: 'Frequency', e: '"Rarely" shows low frequency, placed before the main verb.' },
    ],
    mistakes: [
      { w: 'She drives very careful.', c: 'She drives very carefully.', r: 'Adverbs modifying verbs need the "-ly" form, not the adjective form.' },
      { w: 'He runs fastly.', c: 'He runs fast.', r: '"Fast" is already an adverb; it does not take "-ly".' },
      { w: 'Always I go to school by bus.', c: 'I always go to school by bus.', r: 'Frequency adverbs are placed before the main verb, not at the start of the sentence.' },
    ],
    exercises: [
      { type: 'mcq', q: 'Which is an adverb of frequency?', opts: ['quickly', 'here', 'usually', 'tomorrow'], a: 'usually', e: '"Usually" tells how often something happens.' },
      { type: 'tf', q: '"Fast" becomes "fastly" as an adverb.', a: 'False', e: '"Fast" is already an adverb; adding "-ly" is incorrect.' },
      { type: 'mcq', q: 'Correct placement: "She ___ finishes her homework early."', opts: ['always', 'is always', 'always is', 'be always'], a: 'always', e: 'Frequency adverbs go directly before the main verb.' },
    ],
    summary: 'Manner (-ly, describes how), Time (when), Place (where), Frequency (how often, before main verb). Watch irregular forms: fast, hard stay the same.',
  },

  'en-conjunctions': {
    id: 'en-conjunctions', lang: 'en', level: 'Intermediate', module: 'Conjunctions',
    title: 'Conjunctions: Coordinating & Subordinating',
    desc: 'Join words, phrases, and clauses correctly.',
    objective: 'You can use coordinating and subordinating conjunctions to build compound and complex sentences.',
    intro: 'Conjunctions connect words, phrases, or clauses. Coordinating conjunctions join equal elements; subordinating conjunctions join a main clause with a dependent clause.',
    notes: [
      { h: 'Coordinating Conjunctions (FANBOYS)', b: 'For, And, Nor, But, Or, Yet, So — join equal/independent clauses. Example: "I wanted to go, but it was raining."' },
      { h: 'Subordinating Conjunctions', b: 'Because, although, if, when, since, while — join a dependent clause to a main clause. Example: "Although it was raining, we went out."' },
      { h: 'Comma Rules', b: 'Use a comma before FANBOYS joining two independent clauses. No comma needed for short clauses or single words joined.' },
    ],
    mnemonics: [{ t: 'FANBOYS', tip: 'For-And-Nor-But-Or-Yet-So — the seven coordinating conjunctions, easy to remember with this acronym.' }],
    examples: [
      { t: 'I like tea, and she likes coffee.', c: 'Coordinating', e: '"And" joins two equal independent clauses with a comma.' },
      { t: 'Although he was tired, he finished the race.', c: 'Subordinating', e: '"Although" introduces a dependent clause showing contrast.' },
      { t: 'We stayed home because it was raining.', c: 'Subordinating', e: '"Because" shows the reason for staying home.' },
      { t: 'She wanted to travel, but she had no money.', c: 'Coordinating', e: '"But" shows contrast between two independent clauses.' },
      { t: 'I will call you when I arrive.', c: 'Subordinating', e: '"When" introduces a time-related dependent clause.' },
    ],
    mistakes: [
      { w: 'I like tea and she likes coffee. (no comma)', c: 'I like tea, and she likes coffee.', r: 'A comma is needed before "and" when joining two independent (complete) clauses.' },
      { w: 'Because it was raining. We stayed home.', c: 'Because it was raining, we stayed home.', r: 'A subordinate clause alone is a fragment; it must connect to a main clause.' },
    ],
    exercises: [
      { type: 'mcq', q: 'Which is a coordinating conjunction?', opts: ['because', 'although', 'but', 'since'], a: 'but', e: '"But" is one of the FANBOYS coordinating conjunctions.' },
      { type: 'tf', q: '"Although" is a coordinating conjunction.', a: 'False', e: '"Although" is subordinating — it introduces a dependent clause.' },
      { type: 'mcq', q: 'Fill: "She stayed late ___ she wanted to finish the project."', opts: ['but', 'because', 'or', 'yet'], a: 'because', e: '"Because" explains the reason for staying late.' },
    ],
    summary: 'Coordinating (FANBOYS) joins eq
