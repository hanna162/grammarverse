<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>GrammarVerse — Tatabahasa & English Grammar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

  :root {
    --ink: #14213D;
    --ink-600: #243D5C;
    --ink-400: #7F96C0;
    --ink-100: #D5DCEA;
    --ink-50: #EEF1F7;
    --paper: #FAF8F4;
    --card-bg: #FFFFFF;
    --header-bg: #FFFFFF;
    --melayu: #C1440E;
    --melayu-dark: #8F3208;
    --melayu-50: #FDF1EC;
    --english: #2A6F97;
    --english-dark: #1B4E6E;
    --english-50: #EBF3F8;
    --success: #3A8C63;
    --success-50: #EBF6F0;
    --warning: #D4A017;
    --warning-50: #FBF5E6;
    --danger: #C1440E;
    --danger-50: #FDF1EC;
    --radius: 1.25rem;
    --shadow: 0 1px 2px rgba(20,33,61,0.04), 0 8px 24px -8px rgba(20,33,61,0.12);
    --shadow-hover: 0 4px 8px rgba(20,33,61,0.06), 0 16px 40px -12px rgba(20,33,61,0.20);
    --accent: var(--melayu);
    --accent-dark: var(--melayu-dark);
    --accent-50: var(--melayu-50);
  }

  body.dark-mode {
    --ink: #F4F1EA;
    --ink-600: #D5DCEA;
    --ink-400: #8FA3C7;
    --ink-100: #33456B;
    --ink-50: #1C2A45;
    --paper: #0E182C;
    --card-bg: #14213D;
    --header-bg: #14213D;
    --melayu-50: rgba(193,68,14,0.15);
    --english-50: rgba(42,111,151,0.18);
    --success-50: rgba(58,140,99,0.15);
    --warning-50: rgba(212,160,23,0.15);
    --danger-50: rgba(193,68,14,0.15);
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px -8px rgba(0,0,0,0.4);
    --shadow-hover: 0 4px 8px rgba(0,0,0,0.25), 0 16px 40px -12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    padding-bottom: 72px;
    transition: background-color .25s ease, color .25s ease;
  }
  h1, h2, h3, h4 { font-family: 'Fraunces', Georgia, serif; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  :focus-visible {
    outline: 2px solid var(--melayu);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ===== Layout ===== */
  .container { max-width: 880px; margin: 0 auto; padding: 0 20px; }
  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--ink-50);
    background: var(--header-bg); position: sticky; top: 0; z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.15rem; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--melayu), var(--english)); }
  .header-actions { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center; color: var(--ink);
    transition: background .15s;
  }
  .icon-btn:hover { background: var(--ink-50); }
  .icon-btn svg { width: 20px; height: 20px; }

  /* Default icon sizing: any bare SVG inside interactive elements stays compact
     unless a parent explicitly sets its own width/height (inline style wins). */
  .btn svg, .pill svg, .nav-item svg, button svg:not([style*="width"]) {
    width: 16px; height: 16px; flex-shrink: 0;
  }
  .nav-item svg { width: 20px; height: 20px; }

  /* ===== Bottom nav ===== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: var(--card-bg); border-top: 1px solid var(--ink-50);
    display: flex; padding: 6px 0 max(6px, env(safe-area-inset-bottom));
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: none; padding: 6px 2px; color: var(--ink-400); font-size: 10.5px; font-weight: 600;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { width: 20px; height: 20px; }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 999px; font-weight: 600; border: none; transition: all .15s ease-out;
    padding: 12px 22px; font-size: 0.9rem;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--ink); color: var(--paper); box-shadow: var(--shadow); }
  .btn-primary:hover:not(:disabled) { background: var(--ink-600); box-shadow: var(--shadow-hover); }
  .btn-accent { background: var(--accent); color: white; box-shadow: var(--shadow); }
  .btn-accent:hover:not(:disabled) { background: var(--accent-dark); box-shadow: var(--shadow-hover); }
  .btn-outline { background: transparent; border: 2px solid var(--ink); color: var(--ink); padding: 10px 20px; }
  .btn-outline:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .btn-ghost { background: transparent; color: var(--ink); padding: 10px 16px; }
  .btn-ghost:hover:not(:disabled) { background: var(--ink-50); }
  .btn-sm { padding: 8px 14px; font-size: 0.8rem; }

  /* ===== Cards ===== */
  .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--ink-50); }
  .card-hover { transition: box-shadow .2s, transform .2s; }
  .card-hover:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .card-pad { padding: 20px; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; border-radius: 999px;
    padding: 4px 12px; font-size: 0.7rem; font-weight: 700; font-family: 'JetBrains Mono', monospace;
  }
  .pill-neutral { background: var(--ink-50); color: var(--ink-600); }
  .pill-accent { background: var(--accent-50); color: var(--accent-dark); }
  .pill-success { background: var(--success-50); color: var(--success); }
  .pill-warning { background: var(--warning-50); color: var(--warning); }
  .pill-danger { background: var(--danger-50); color: var(--danger); }

  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-400); margin-bottom: 8px; display: block; }

  /* ===== Home / language cards ===== */
  .lang-grid { display: grid; gap: 16px; margin: 28px 0; }
  @media (min-width: 640px) { .lang-grid { grid-template-columns: 1fr 1fr; gap: 0; } }
  .lang-card {
    text-align: left; border: none; color: white; padding: 32px 28px; min-height: 240px;
    display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;
    transition: transform .3s;
  }
  .lang-card:hover { transform: translateY(-4px); }
  .lang-card.ms { background: var(--melayu); border-radius: var(--radius) var(--radius) 0 0; }
  .lang-card.en { background: var(--english); border-radius: 0 0 var(--radius) var(--radius); }
  @media (min-width: 640px) {
    .lang-card.ms { border-radius: var(--radius) 0 0 var(--radius); }
    .lang-card.en { border-radius: 0 var(--radius) var(--radius) 0; }
  }
  .lang-emoji { font-size: 2.5rem; display: block; margin-bottom: 14px; }
  .lang-title { font-size: 1.4rem; font-weight: 600; margin-bottom: 8px; }
  .lang-desc { font-size: 0.85rem; opacity: 0.85; max-width: 280px; line-height: 1.5; }
  .lang-cta { font-size: 0.85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; white-space: nowrap; }
  .lang-cta svg { width: 16px; height: 16px; flex-shrink: 0; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat-box { text-align: center; padding: 14px 8px; }
  .stat-num { font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 600; }
  .stat-label { font-size: 0.7rem; color: var(--ink-400); margin-top: 2px; }

  /* ===== Progress ring ===== */
  .ring-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
  .ring-label { position: absolute; text-align: center; }
  .ring-num { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.1rem; }

  /* ===== Topic list ===== */
  .topic-row {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
    border-bottom: 1px solid var(--ink-50); cursor: pointer; transition: background .15s;
  }
  .topic-row:last-child { border-bottom: none; }
  .topic-row:hover { background: #fafafa; }
  .topic-row.locked { opacity: 0.55; cursor: not-allowed; }
  .topic-row-left { display: flex; align-items: center; gap: 12px; }

  /* ===== Topic detail ===== */
  .section-nav {
    display: flex; gap: 4px; overflow-x: auto; padding: 10px 0; margin-bottom: 4px;
    border-bottom: 1px solid var(--ink-50); position: sticky; top: 61px; background: var(--paper); z-index: 20;
  }
  .section-nav a {
    white-space: nowrap; padding: 6px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 700;
    color: var(--ink-600); text-decoration: none; flex-shrink: 0;
  }
  .section-nav a:hover { background: var(--ink-50); }
  .topic-section { padding: 28px 0; border-bottom: 1px solid var(--ink-50); scroll-margin-top: 110px; }
  .topic-section:last-child { border-bottom: none; }

  .note-box { border-radius: 14px; padding: 16px; margin-bottom: 12px; background: var(--ink-50); }
  .note-box h4 { font-size: 0.9rem; margin-bottom: 6px; font-family: 'Inter', sans-serif; font-weight: 700; }
  .note-box p { font-size: 0.85rem; line-height: 1.6; color: var(--ink-600); white-space: pre-line; }

  .example-grid { display: grid; gap: 10px; }
  @media (min-width: 640px) { .example-grid { grid-template-columns: 1fr 1fr; } }
  .example-card { padding: 14px; cursor: pointer; }
  .example-card p.txt { font-size: 0.88rem; font-weight: 500; margin-bottom: 8px; }
  .example-card .exp { font-size: 0.78rem; color: var(--ink-400); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--ink-50); display: none; }
  .example-card.open .exp { display: block; }

  .mistake-card { padding: 14px; margin-bottom: 10px; }
  .mistake-line { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; font-size: 0.85rem; }
  .mistake-wrong { text-decoration: line-through; color: var(--ink-400); }
  .mistake-correct { font-weight: 600; }
  .mistake-reason { font-size: 0.78rem; color: var(--ink-400); padding-left: 24px; }

  /* ===== Exercise runner ===== */
  .exercise-box { max-width: 560px; margin: 0 auto; }
  .exercise-progress { display: flex; gap: 4px; margin-bottom: 18px; }
  .exercise-dot { height: 5px; flex: 1; border-radius: 999px; background: var(--ink-50); }
  .exercise-dot.done { background: var(--success); }
  .exercise-dot.active { background: var(--accent); }
  .exercise-q { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 500; margin-bottom: 18px; }
  .opt-btn {
    display: block; width: 100%; text-align: left; padding: 13px 16px; border-radius: 14px;
    border: 2px solid var(--ink-50); background: var(--card-bg); color: var(--ink); font-size: 0.88rem; font-weight: 500;
    margin-bottom: 8px; transition: border-color .15s;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--ink-100); }
  .opt-btn.selected { border-color: var(--ink); }
  .opt-btn.correct { border-color: var(--success); background: var(--success-50); color: var(--success); }
  .opt-btn.wrong { border-color: var(--danger); background: var(--danger-50); color: var(--danger); }
  .feedback-box { border-radius: 14px; padding: 14px; margin: 14px 0; font-size: 0.85rem; }
  .feedback-box.correct { background: var(--success-50); color: var(--success); }
  .feedback-box.incorrect { background: var(--danger-50); color: var(--danger); }
  .feedback-box .exp-text { color: var(--ink-600); margin-top: 4px; }

  /* ===== Flashcard ===== */
  .flashcard-wrap { max-width: 380px; margin: 0 auto; }
  .flashcard { aspect-ratio: 4/3; perspective: 1000px; margin-bottom: 20px; cursor: pointer; }
  .flashcard-inner { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
  .flashcard-face {
    position: absolute; inset: 0; border-radius: var(--radius); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px; backface-visibility: hidden;
    box-shadow: var(--shadow);
  }
  .flashcard-front { background: var(--accent); color: white; }
  .flashcard-back { background: var(--card-bg); transform: rotateY(180deg); }

  /* ===== Memory game ===== */
  .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .memory-card {
    aspect-ratio: 1; border-radius: 12px; border: none; display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 600; text-align: center; padding: 6px; background: var(--ink-50); transition: all .2s;
  }
  .memory-card.flipped { background: var(--accent); color: white; }
  .memory-card.matched { background: var(--success-50); color: var(--success); }

  /* ===== Misc ===== */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-400); }
  .divider { height: 1px; background: var(--ink-50); margin: 16px 0; }
  table.mini { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.mini th, table.mini td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--ink-50); }
  table.mini th { background: var(--ink-50); font-weight: 700; }

  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 12px 20px; border-radius: 999px;
    font-size: 0.85rem; font-weight: 600; box-shadow: var(--shadow-hover); z-index: 100;
    animation: toast-in .3s ease-out;
  }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  .fade-in { animation: fade-in .3s ease-out; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast-root"></div>

<script src="topics-data.js"></script>
<script src="app.js"></script>
</body>
</html>
